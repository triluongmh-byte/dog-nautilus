; Compile-only project. Never flash from this worktree.
; espressif32@6.5.0 == Arduino-ESP32 core 2.0.14 (the version used by tools/firmware/check.sh).
[env:esp32c3_supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  olikraus/U8g2@2.36.19
  links2004/WebSockets@2.7.2
